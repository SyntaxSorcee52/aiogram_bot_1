version: '3.8'

services:
  # 1. БОТ НА PYTHON
  bot:
    build: .                 # Собрать образ из текущей папки (используя Dockerfile)
    container_name: tg_bot
    restart: always
    environment:
      - DB_HOST=postgres     # Передаём имя контейнера БД
      - REDIS_HOST=redis     # Передаём имя контейнера Redis
    depends_on:              # Бот запустится только ПОСЛЕ запуска базы и реддиса
      - postgres
      - redis
  # 1. СЕРВИС БАЗЫ ДАННЫХ
  postgres:
    image: postgres:16-alpine      # Скачай готовый образ Postgres
    container_name: bot_postgres   # Название контейнера
    environment:
      POSTGRES_USER: postgres      # Логин
      POSTGRES_PASSWORD: secret     # Пароль
      POSTGRES_DB: bot_db          # Название базы
    ports:
      - "5432:5432"                # Открываем порт 5432 для подключения с нашего ПК (localhost:5432)
    volumes:
      - pgdata:/var/lib/postgresql/data # Сохраняем данные на диске, чтобы они не удалялись при выключении

  # 2. СЕРВИС REDIS (КЭШ/СОСТОЯНИЯ)
  redis:
    image: redis:7-alpine
    container_name: bot_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: # Дисковый объем для базы